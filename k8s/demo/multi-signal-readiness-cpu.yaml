apiVersion: v1
kind: Pod
metadata:
  name: multi-signal-demo
  namespace: aiops-demo
  labels:
    app: multi-signal-demo
spec:
  containers:
    - name: multi-signal-demo
      image: python:3.12-alpine
      command:
        - /bin/sh
        - -c
        - |
          cat >/tmp/server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import threading

          def burn_cpu():
              while True:
                  17 ** 17

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/ready":
                      self.send_response(503)
                      self.end_headers()
                      self.wfile.write(b"synthetic readiness failure\n")
                      print("readiness endpoint returned 503", flush=True)
                      return
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ok\n")

              def log_message(self, format, *args):
                  print(format % args, flush=True)

          print("starting synthetic CPU workload", flush=True)
          threading.Thread(target=burn_cpu, daemon=True).start()
          HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          PY
          exec python /tmp/server.py
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /ready
          port: 8080
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
